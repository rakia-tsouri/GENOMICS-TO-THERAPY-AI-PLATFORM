[project]
name = "gtt-contracts"
version = "0.1.0"
description = "Shared interface contracts (Pydantic models) for the Genomics-to-Therapy AI Platform"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gtt_contracts"]
