<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bridge</title>
</head>
<body>
  <p>Loading…</p>
  <script>
    const q = new URLSearchParams(window.location.search);
    const token = q.get("token");
    const to = q.get("to") || "/dashboard";
    if (token) {
      try { localStorage.setItem("g2t_token", token); } catch (e) {}
    }
    window.location.replace(to);
  </script>
</body>
</html>
